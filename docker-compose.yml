# Docker 部署配置（对接 1Panel 托管的 MySQL / Redis）
# 更新代码的标准流程（三条命令即可）：
#   cd /opt/enterprisems
#   git pull
#   docker compose up -d --build
#
# 重要约定：
#   - 不复用 compose 自带数据库/缓存，统一使用 1Panel 托管的
#     1Panel-mysql-M5XR（MySQL）与 1Panel-redis-PbHW（Redis）。
#   - 因此 app 容器必须加入已存在的外部网络 1panel-network，
#     才能通过主机名解析上述两个服务（默认网络解析不到）。
#   - 环境变量（DB_* / REDIS_*）从同目录 .env 注入。
#   - 首次切换到 compose 管理时，需先 docker rm 掉旧的（docker run 创建的）enterprisms 容器。

services:
  app:
    build: .
    image: enterprisms:latest
    container_name: enterprisms
    networks:
      - 1panel-network
    ports:
      - "5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

networks:
  1panel-network:
    external: true
